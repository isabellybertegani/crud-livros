<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biblioteca - Formulário</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topo">
    <h1>📚 Biblioteca</h1>
    <p>Cadastro de livros &middot; UMC</p>
</header>

<main class="container estreito">
    <h2 th:text="${livro.id == null} ? 'Novo livro' : 'Editar livro'">Novo livro</h2>

    <form th:action="@{/livros/salvar}" th:object="${livro}" method="post" class="formulario">
        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" th:field="*{titulo}"
                   th:classappend="${#fields.hasErrors('titulo')} ? 'invalido'">
            <span class="erro" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>
        </div>

        <div class="campo">
            <label for="autor">Autor</label>
            <input type="text" id="autor" th:field="*{autor}"
                   th:classappend="${#fields.hasErrors('autor')} ? 'invalido'">
            <span class="erro" th:if="${#fields.hasErrors('autor')}" th:errors="*{autor}"></span>
        </div>

        <div class="campo">
            <label for="ano">Ano de publicação</label>
            <input type="number" id="ano" th:field="*{ano}"
                   th:classappend="${#fields.hasErrors('ano')} ? 'invalido'">
            <span class="erro" th:if="${#fields.hasErrors('ano')}" th:errors="*{ano}"></span>
        </div>

        <div class="campo">
            <label for="genero">Gênero</label>
            <input type="text" id="genero" th:field="*{genero}"
                   th:classappend="${#fields.hasErrors('genero')} ? 'invalido'">
            <span class="erro" th:if="${#fields.hasErrors('genero')}" th:errors="*{genero}"></span>
        </div>

        <div class="botoes">
            <button type="submit" class="btn btn-principal">Salvar</button>
            <a th:href="@{/livros}" class="btn btn-claro">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>

spring.application.name=biblioteca

# --- Banco de dados (MySQL do XAMPP) ---
# O banco "biblioteca" e criado automaticamente se nao existir.
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
# Senha FORA do codigo: vem da variavel de ambiente DB_PASSWORD.
# No XAMPP o usuario root vem sem senha, entao o padrao e vazio.
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# "update" cria/atualiza a tabela sem apagar os dados ao reiniciar.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false
